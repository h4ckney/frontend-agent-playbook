name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  documentation-and-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 action runtime
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24 action runtime
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false

      - name: Record validation runtime
        run: node --version

      - name: Validate browser artifact schemas
        run: node scripts/sync-artifact-schemas.mjs --check

      - name: Validate documentation
        run: node scripts/validate-docs.mjs

      - name: Validate plugin package synchronization
        run: node scripts/sync-plugin-package.mjs --check

      - name: Check analyzer syntax
        run: |
          node --check analysis/app.js
          node --check analysis/analyzer.js
          node --check analysis/audit-contract.js
          node --check analysis/triage-state.js
          node --check analysis/lockfile-graph.js
          node --check analysis/vendor/js-yaml-5.5.0.js
          node --check analysis/security-context.js
          node --check analysis/artifact-schemas.js
          node --check bin/frontend-agent-audit.mjs

      - name: Test analyzer
        run: node --test analysis/*.test.mjs bin/frontend-agent-audit.test.mjs scripts/dashboard-provenance.test.mjs scripts/query-osv.test.mjs

      - name: Test guidance approval gate
        run: node --test scripts/guidance-approval.test.mjs

  dashboard-browser:
    needs: documentation-and-analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up browser-test runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/frontend-browser-tools" --no-save --ignore-scripts --package-lock=false playwright@1.64.1
          node "$RUNNER_TEMP/frontend-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify served dashboard in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/frontend-browser-tools/node_modules
        run: node scripts/verify-dashboard-ci.mjs "$RUNNER_TEMP/frontend-browser-evidence"
      - name: Preserve browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-browser-evidence
          retention-days: 7
          if-no-files-found: error
