name: Keyless round trip

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/keyless-live-round-trip
    paths:
      - .github/workflows/keyless-round-trip.yml
      - verification/round-trip/**
      - verification/sigstore-keyless.cjs

permissions:
  contents: read

concurrency:
  group: keyless-round-trip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-synthetic-round-trip:
    if: >-
      github.repository == 'h4ckney/frontend-agent-playbook' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/keyless-live-round-trip')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out this exact trusted-repository commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: h4ckney/frontend-agent-playbook
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Install isolated pinned verification and signing tooling
        run: |
          npm ci --prefix verification/sigstore --ignore-scripts --no-audit --no-fund
          npm ci --prefix verification/round-trip --ignore-scripts --no-audit --no-fund
      - name: Verify current public TUF trust
        run: |
          mkdir "$RUNNER_TEMP/keyless-round-trip-trust"
          node verification/refresh-sigstore-tuf.mjs --initialize --bootstrap verification/round-trip/bootstrap-root.json --bootstrap-sha256 sha256:27aea7e372aa7864065174f0661784fcf8b0e28b1dbfebeada31a0f1fb19167f --mirror https://tuf-repo-cdn.sigstore.dev --state "$RUNNER_TEMP/keyless-round-trip-trust/state.json"
      - name: Issue OIDC and Fulcio certificate, publish synthetic proof, verify bindings
        env:
          SIGSTORE_PUBLICATION_ACK: public-synthetic-keyless-round-trip-v1
        run: node verification/round-trip/run.mjs --state "$RUNNER_TEMP/keyless-round-trip-trust/state.json" --output "$RUNNER_TEMP/keyless-round-trip"
      - name: Reject credentials and unexpected artifact files
        id: evidence-guard
        if: ${{ !cancelled() }}
        run: node verification/round-trip/check-public-evidence.mjs "$RUNNER_TEMP/keyless-round-trip"
      - name: Preserve only public synthetic evidence
        if: ${{ !cancelled() && steps.evidence-guard.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyless-round-trip-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/keyless-round-trip/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
